  starting_inventory:
    - field_camera
    - field_notes
    - agent_badge
intro:
  title: The Warehouse
  text: |
    The call came without a case number.

    A warehouse on the edge of the city. Five missing children.
    No local authorities. No uniforms. No press.

    Your instructions were simple.

    Find the children.

    Do not involve the police.

    Do not contact the parents unless specifically instructed.

    And under no circumstances discuss the contents of the warehouse
    with anyone outside your chain of command.

    When you arrive, the building looks abandoned.

    It isn't.

    A man in a black suit is waiting beside the main entrance.

    He introduces himself only as your contact.

    You notice several things immediately.

    He has no identification.

    He knows your name.

    He knows you arrived eight minutes earlier than expected.

    And he doesn't seem particularly concerned that five children
    have disappeared inside a government warehouse.

    "They broke in three nights ago," he tells you.

    "Five of them. Friends, apparently."

    He pauses.

    "They found something they shouldn't have."

    He hands you a camera.

    It looks like an ordinary field camera, except for the additional
    controls mounted beneath the lens.

    "This isn't ordinary photographic equipment."

    He points toward the warehouse.

    "The first setting lets you see through objects."

    He taps another control.

    "The second shows things that aren't visible to the human eye."

    You look at him.

    "What exactly am I looking for?"

    The man smiles.

    "Anything that shouldn't be there."

    The warehouse door opens.

    You step inside.

    The door closes behind you.

    The man remains outside.

    At least, you think he does.
  instructions: |
    Explore the warehouse and investigate the disappearance of the five children.

    Examine objects carefully:
    type look [item]

    Use items with objects:
    type use [item] with [target]

    Your field notes record important discoveries.

    The field camera has several viewing modes. Some clues can only be
    discovered by photographing or scanning objects.

    Some objects may look ordinary until photographed.

    Some photographs may show things that are not physically present.

    Type help for a full list of commands.
