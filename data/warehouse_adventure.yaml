win_screen:
  title: THE LAST PIECE
  text: |
    The five pieces lock together.

    For several seconds nothing happens.

    Then the device begins to hum.

    The warehouse disappears.

    Not physically.

    Something much stranger happens.

    For one impossible instant you can see every place you have visited
    during the investigation layered together.

    The warehouse.

    The forest.

    The silent city.

    The machine world.

    The impossible Earth.

    And somewhere inside all of them, five children.

    The device pulses.

    The five children are returned.

    They stumble onto the warehouse floor, confused, exhausted, and alive.

    You turn toward the man in black.

    He is staring at the assembled device.

    "Excellent," he says.

    You look at the wanted posters you collected during the investigation.

    Then at him.

    He notices.

    "Ah."

    He smiles.

    "You noticed those."

    His face changes.

    Not much.

    Just enough.

    His eyes are no longer quite the right shape.

    Something moves beneath the skin of his forehead.

    His hands lengthen for a moment before returning to normal.

    He sighs.

    "I suppose there is no point pretending anymore."

    You raise your weapon.

    He raises both hands.

    "Please. If I wanted you dead, Agent, you would have been dead
    somewhere around the second dimension."

    He picks up the device.

    "I borrowed this."

    You stare at him.

    "You stole it."

    "Borrowed."

    "You're wanted."

    He looks genuinely offended.

    "On several worlds."

    The device activates.

    A doorway opens where the warehouse wall used to be.

    He steps toward it.

    Then stops.

    "The children?"

    You look behind you.

    All five are together.

    He nods.

    "Good."

    He steps through the doorway.

    Before disappearing completely, he turns.

    "Do try not to mention me in your report."

    The doorway closes.

    You are left standing in the warehouse with five exhausted children,
    a strange camera, and several questions that no federal agency is
    prepared to answer.

    You look at the camera.

    Its display contains one final photograph.

    You did not take it.

    It shows the warehouse.

    Fifty years ago.

    In the background stands the man in black.

    Beside him stands you.

    You close the camera.

    You decide not to put that part in the report.
