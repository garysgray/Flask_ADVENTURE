    states:
      default: A small communications room. Dozens of radios line the walls. Only one is active.
      changed: The radio room. The active radio is now transmitting a frequency that matches the signal from the warehouse.
    items:
      - kid_three
    exit_destinations: {}
  - name: machine_world
    exits:
      - east
    states:
      default: A world built entirely from machinery. Towers of gears and enormous pistons disappear into the distance. There is no visible sky.
      changed: The machine world. The machinery has synchronized to a single rhythm.
    items:
      - wanted_poster_four
    exit_destinations: {}
  - name: machine_console
    exits:
      - west
      - east
    states:
      default: A control chamber surrounded by moving machinery. A central console contains a series of impossible controls.
      changed: The console has aligned itself with the dimensional frequency. A doorway has opened.
    items:
      - kid_four_clue
    exit_destinations: {}
  - name: machine_gateway
    exits:
      - west
    states:
      default: A chamber containing a doorway made entirely from rotating gears. Something is standing beyond it.
      changed: The gateway has stabilized. The fourth child is waiting nearby.
    items:
      - kid_four
    exit_destinations: {}
  - name: wrong_earth
    exits:
      - east
    states:
      default: |-
        The place looks like Earth.
        Almost.
        Buildings are familiar. Roads are familiar. The sky is familiar.
        But every sign contains slightly different words.
        People walk the streets without looking at you.
        Then one of them turns and says your name.
      changed: The wrong Earth. Several people have disappeared. You are beginning to suspect that this place recognizes you.
    items:
      - wanted_poster_five
    exit_destinations: {}
  - name: impossible_archive
    exits:
      - west
    states:
      default: An archive containing records of events that have not happened yet. Shelves contain photographs of places you have visited.
      changed: The archive. One photograph has appeared showing the warehouse from fifty years ago.
    items:
      - kid_five_clue
    exit_destinations: {}
  - name: final_gateway
    exits:
      - east
    states:
      default: A white room containing nothing except a standing mirror. Your reflection is delayed by approximately one second.
      changed: The mirror has become transparent. The fifth child is standing on the other side.
    items:
      - kid_five
    exit_destinations: {}
  - name: return_chamber
    exits:
      - west
    states:
      default: The central chamber of the dimensional machine. Five empty mounting points surround the device.
      changed: The machine is complete. Five fragments glow within their mounting points. The entire chamber is vibrating.
    items: []
    exit_destinations: {}
  - name: generic_warehouse_hall
    exits:
      - west
      - north
      - east
    states:
      default: A long warehouse corridor lined with numbered storage doors.
    items: []
    exit_destinations: {}
  - name: generic_service_hall
    exits:
      - north
    states:
      default: A narrow service corridor filled with pipes and electrical conduit.
    items: []
    exit_destinations: {}
events:
  - id: discover_camera
    type: puzzle
    check_type: item_used_with
    parameters:
      item: field_camera
      target: warehouse_crate
      room: storage_bay
    result:
      set_item_state:
        - item: field_camera
          state: changed
      message: |
        You activate the camera's X-ray mode.

        The crate appears empty.

        Then you switch to spectral mode.

        Something is inside.

        Not something hidden inside the crate.

        Something occupying the same space as the crate.

        The camera displays a single word:

        RESONANCE.
  - id: find_piece_one
    type: puzzle
    check_type: item_used_with
    parameters:
      item: field_camera
      target: warehouse_crate
      room: restricted_storage
    result:
      set_state:
        - room: restricted_storage
          state: changed
        - room: device_chamber
          state: changed
      add_item:
        item: dimensional_shard_one
        room: device_chamber
      open_exit:
        - room: restricted_storage
          direction: south
          destination:
            floor: 0
            x: 0
            'y': 2
        - room: device_chamber
          direction: north
          destination:
            floor: 0
            x: 0
            'y': 1
      message: |
        The camera shows a shape inside the unmarked crate.

        There is no visible object when you open it.

        You photograph the empty interior.

        The photograph develops instantly.

        A black metallic fragment appears in the image.

        When you reach into the crate, your hand closes around it.

        The first piece is real.
  - id: rescue_kid_one
    type: puzzle
    check_type: item_used_with
    parameters:
      item: dimensional_shard_one
      target: dimensional_gate
      room: dimensional_room
      prerequisites:
        - find_piece_one
    result:
      set_state:
        - room: dimensional_room
          state: changed
        - room: forest_clearing
          state: changed
      open_exit:
        - room: dimensional_room
          direction: east
          destination:
            floor: 1
            x: 0
            'y': 0
        - room: strange_forest
          direction: west
          destination:
            floor: 0
            x: 2
            'y': 2
      message: |
        The shard locks into the dimensional gateway.

        The room disappears.

        For one moment you see somewhere else.

        A child is standing alone beneath a strange sky.

        Then the gateway stabilizes.

        You can cross.
  - id: find_piece_two
    type: puzzle
    check_type: item_used_with
    parameters:
      item: field_camera
      target: forest_gateway
      room: forest_clearing
      prerequisites:
        - rescue_kid_one
    result:
      set_state:
        - room: strange_forest
          state: changed
      add_item:
        item: dimensional_shard_two
        room: strange_forest
      message: |
        You photograph the stone arch.

        The photograph shows a second arch behind the first.

        The child points toward it.

        "That's where it landed."

        Beneath the second arch lies the second fragment.
  - id: rescue_kid_two
    type: puzzle
    check_type: item_used_with
    parameters:
      item: dimensional_shard_two
      target: dimensional_gate
      room: strange_forest
      prerequisites:
        - find_piece_two
    result:
      set_state:
        - room: strange_forest
          state: changed
        - room: forest_clearing
          state: changed
      message: |
        The second fragment activates.

        The forest folds inward like a photograph being closed.

        When the world settles, the second child is standing beside you.

        In the child's hand is a photograph of a city with no people.

        The third piece is there.
      open_exit:
        - room: strange_forest
          direction: north
          destination:
            floor: 1
            x: 3
            'y': 0
        - room: silent_city
          direction: south
          destination:
            floor: 1
            x: 0
            'y': 0
  - id: find_piece_three
    type: puzzle
    check_type: item_used_with
    parameters:
      item: field_camera
      target: city_terminal
      room: city_terminal
      prerequisites:
        - rescue_kid_two
    result:
      set_state:
        - room: city_terminal
          state: changed
        - room: silent_city
          state: changed
      add_item:
        item: dimensional_shard_three
        room: silent_city
      message: |
        You photograph the terminal screen.

        The visible map disappears.

        A second map appears beneath it.

        One location is marked:

        UNIT 03.

        You follow the signal.

        The third fragment is waiting inside the radio room.
  - id: rescue_kid_three
    type: puzzle
    check_type: item_used_with
    parameters:
      item: audio_recorder
      target: spectrum_console
      room: photographic_lab
      prerequisites:
        - find_piece_three
    result:
      set_state:
        - room: silent_radio_room
          state: changed
        - room: city_terminal
          state: changed
      message: |
        The corrupted recording is not corrupted.

        It is encoded.

        You feed the recording into the spectrum analyzer.

        The noise becomes a sequence of coordinates.

        The radio room.

        The child is alive.

        You follow the signal and find the third child.
  - id: find_piece_four
    type: puzzle
    check_type: item_used_with
    parameters:
      item: dimensional_shard_three
      target: dimensional_gate
      room: silent_radio_room
      prerequisites:
        - rescue_kid_three
    result:
      set_state:
        - room: machine_world
          state: changed
      add_item:
        item: dimensional_shard_four
        room: machine_world
      message: |
        The third fragment opens another passage.

        This world is made of machinery.

        The fourth piece is embedded inside the largest machine
        you can see.
      open_exit:
        - room: silent_radio_room
          direction: south
          destination:
            floor: 1
            x: 0
            'y': 2
        - room: machine_world
          direction: north
          destination:
            floor: 1
            x: 4
            'y': 1
  - id: rescue_kid_four
    type: puzzle
    check_type: item_used_with
    parameters:
      item: dimensional_shard_four
      target: machine_console
      room: machine_console
      prerequisites:
        - find_piece_four
    result:
      set_state:
        - room: machine_console
          state: changed
        - room: machine_gateway
          state: changed
      message: |
        You insert the fourth fragment into the machine console.

        Every machine in the world stops.

        Silence.

        Then one enormous gear begins moving.

        The gateway opens.

        The fourth child steps through.

        "One more," the child says.

        "Then we go home."
      open_exit:
        - room: machine_gateway
          direction: east
          destination:
            floor: 2
            x: 0
            'y': 0
        - room: wrong_earth
          direction: west
          destination:
            floor: 1
            x: 2
            'y': 2
  - id: find_piece_five
    type: puzzle
    check_type: item_used_with
    parameters:
      item: field_camera
      target: wrong_earth
      room: wrong_earth
      prerequisites:
        - rescue_kid_four
    result:
      set_state:
        - room: wrong_earth
          state: changed
        - room: impossible_archive
          state: changed
      add_item:
        item: dimensional_shard_five
        room: wrong_earth
      message: |
        You photograph the street.

        The camera shows a wanted poster that does not exist on the wall.

        Behind the poster is a door.

        Behind the door is the fifth fragment.

        The photograph disappears.

        The door remains.

        You open it.

        The fifth piece is waiting.
  - id: rescue_kid_five
    type: puzzle
    check_type: item_used_with
    parameters:
      item: dimensional_shard_five
      target: mirror_gateway
      room: final_gateway
      prerequisites:
        - find_piece_five
    result:
      set_state:
        - room: final_gateway
          state: changed
        - room: impossible_archive
          state: changed
      message: |
        The fifth fragment touches the mirror.

        Your reflection disappears.

        The fifth child walks through the glass.

        "You found all five."

        The child looks at the fragments.

        "Now put it back together."
      open_exit:
        - room: impossible_archive
          direction: east
          destination:
            floor: 2
            x: 3
            'y': 0
        - room: final_gateway
          direction: west
          destination:
            floor: 2
            x: 1
            'y': 0
  - id: assemble_device
    type: puzzle
    check_type: item_used_with
    parameters:
      item: dimensional_shard_five
      target: device_mount
      room: return_chamber
      prerequisites:
        - rescue_kid_one
        - rescue_kid_two
        - rescue_kid_three
        - rescue_kid_four
        - rescue_kid_five
    result:
      set_state:
        - room: return_chamber
          state: changed
        - room: warehouse_entrance
          state: changed
      set_item_state:
        - item: dimensional_shard_one
          state: changed
        - item: dimensional_shard_two
          state: changed
        - item: dimensional_shard_three
          state: changed
        - item: dimensional_shard_four
          state: changed
        - item: dimensional_shard_five
          state: changed
      message: |
        You place the final fragment into the machine.

        The five pieces lock together.

        The device hums.

        The children stand behind you.

        The man in black steps into the chamber.

        He looks at the completed machine.

        "Finally."

        You look at him.

        He smiles.

        "I suppose you've figured out why those posters kept following you."
