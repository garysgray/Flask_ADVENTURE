# =============================================================================
# TEST THE ROOM — ROOM & ITEM DESCRIPTION SHOWCASE
# =============================================================================
# This file demonstrates:
#   1. Dynamic Room Description Assembly (base + sorted fixtures + trailing)
#   2. Fixture-Specific Examine Text (independent of the room overview)
#   3. Combinatorial Independence (mutating fixtures in any order)
#   4. Dynamic Visibility (empty string "" hides fixture from room text until revealed)
#   5. Item Descriptions (inventory items vs floor items vs used items)
# =============================================================================

player:
  starting_inventory:
    - crystal_resonator

intro:
  title: The Specimen Vault
  text: |
    Welcome to the room description test chamber!
    
    In this chamber you can test:
      - 'look' to see how the room description stitches together.
      - 'examine pod', 'examine switch', 'examine crystal' to see targeted inspection text.
      - 'pull switch' to see the power switch change state independently.
      - 'use crystal on pod' to unlock the specimen pod and reveal a hidden crevice.
      - Notice how the room overview updates accurately regardless of which you do first!
  instructions: |
    Experiment with 'look', 'examine <target>', 'pull switch', and 'use crystal on pod'.

win_conditions:
  - activate_vault_power
  - breach_specimen_pod

win_screen:
  title: TEST PROTOCOL COMPLETE
  text: |
    All room fixtures and item states have been observed and verified!

# =============================================================================
# ITEMS
# =============================================================================
items:
  crystal_resonator:
    display_name: vibrating crystal resonator
    aliases:
      - crystal
      - resonator
      - crystal resonator
    solo_keywords:
      - examine
      - use
    action_keywords:
      - use
      - tune
    states:
      default:
        description: A translucent quartz rod that vibrates faintly in the palm of your hand.
        use: |
          You hold the crystal close. Its harmonic vibration tingles against your skin.

  containment_keycard:
    display_name: magnetic keycard
    aliases:
      - card
      - keycard
      - magnetic keycard
    solo_keywords:
      - examine
      - get
      - take
    action_keywords:
      - get
      - take
    states:
      default:
        description: A dark polymer access card recovered from the specimen chamber.
        use: |
          A security keycard stamped with Level 4 clearance.

# =============================================================================
# TARGET ALIASES (Scenery & Fixtures)
# =============================================================================
target_aliases:
  power_switch:
    - switch
    - lever
    - power switch
    - knife switch

  containment_pod:
    - pod
    - specimen pod
    - glass pod
    - chamber

  wall_crevice:
    - crevice
    - crack
    - wall crevice
    - secret compartment

  spiral_stairs:
    - stairs
    - spiral stairs
    - staircase
    - steps
    - ladder

  rift_emitter:
    - emitter
    - rift
    - rift emitter
    - portal generator
    - gateway

  resonance_conduit:
    - conduit
    - resonance conduit
    - upper portal
    - gateway

  ancient_pedestal:
    - pedestal
    - ancient pedestal
    - terminal
    - archive portal

  hatch_mechanism:
    - hatch
    - hatch mechanism
    - emergency hatch
    - maintenance hatch
    - latch

# =============================================================================
# CUSTOM VERBS
# =============================================================================
custom_verbs:
  two_object:
    - use
    - pull
    - tune
    - unlock

# =============================================================================
# ROOMS
# =============================================================================
rooms:
  - name: specimen_vault
    exits:
      - south
      - up
      - east

    # 1. Base Description: Permanent opening paragraph
    base_description: |
      You are standing inside the reinforced specimen vault. Reinforced titanium plating lines the walls.

    # 2. Modular Fixtures: Each has its own priority, room description state, and examine prose
    fixtures:
      # Fixture 1: Appears first in the room description (priority: 10)
      power_switch:
        priority: 10
        state: default
        states:
          default: "A heavy knife-switch lever is mounted to the north wall, currently flipped to OFF."
          energized: "The knife-switch on the north wall is pulled DOWN, bathing the conduit in a steady blue glow and tearing open an ethereal portal."
        examine:
          default: "An industrial steel knife-switch. Pulling it will route auxiliary power into the room and activate the spatial portal."
          energized: "The switch handle is latched down. High-voltage capacitors hum rhythmically behind the plate, sustaining an open portal."

      # Fixture 2: Appears second in the room description (priority: 20)
      containment_pod:
        priority: 20
        state: default
        states:
          default: "In the center of the vault rests a reinforced glass containment pod sealed with acoustic clamps."
          breached: "In the center of the vault, the containment pod stands wide open, its acoustic clamps shattered."
        examine:
          default: "A cylindrical cryo-pod. The acoustic seal vibrates at a frequency that matches your crystal."
          breached: "The seal has been released. Frost evaporates from the interior cradle."

      # Fixture 3: Empty string trick (priority: 30)
      # When state is 'hidden', it produces "" and is omitted from 'look', but still examinable!
      wall_crevice:
        priority: 30
        state: hidden
        states:
          hidden: ""
          revealed: "Behind the opened pod, a shadowy crevice in the masonry has become visible."
        examine:
          hidden: "You notice hairline stress fractures in the masonry behind the pod, but it's too dark to see inside."
          revealed: "A small hollow in the wall plate. It contains a magnetic keycard."

    # 3. Trailing Description: Permanent closing paragraph
    trailing_description: |
      Spiral stairs lead UP to the mezzanine. A blast door to the south leads to security, and an airlock to the east leads to the translocation lab.

    items: []
    exit_destinations: {}

  - name: security_corridor
    exits:
      - north
    base_description: |
      A fortified security corridor. Low amber light glints against the interlocking floor plates.
    fixtures:
      hatch_mechanism:
        priority: 10
        state: default
        states:
          default: "A reinforced emergency maintenance hatch is sealed tightly into the steel flooring."
          unlocked: "The emergency maintenance hatch is unlatched and standing open, with an iron ladder leading DOWN into the depths."
        examine:
          default: "A heavy sub-level access hatch. The locking console requires a security keycard to release."
          unlocked: "The heavy hatch is swung open. An iron ladder descends through the darkness."
    trailing_description: |
      The specimen vault blast door is to the north.
    items: []
    exit_destinations: {}

  - name: translocation_lab
    exits:
      - west
      - portal
    exit_destinations:
      portal:
        floor: 1
        x: 1
        y: 0
    base_description: |
      The translocation laboratory. High-voltage coils surround an active stationary dimensional rift in the chamber.
    fixtures:
      rift_emitter:
        priority: 10
        state: default
        states:
          default: "A spinning rift emitter projects a stable swirling blue portal against the containment field."
        examine:
          default: "A high-precision transit gateway. Stepping into or through the PORTAL will instantly warp you to the upper catwalk."
    trailing_description: |
      An airlock to the west returns to the specimen vault. A humming PORTAL shimmers in the center.
    items: []

  - name: mezzanine_observation
    exits:
      - down
      - east
    base_description: |
      An elevated mezzanine observation gallery overlooking the containment chambers.
    fixtures:
      spiral_stairs:
        priority: 10
        state: default
        states:
          default: "A spiral staircase curves DOWN through the floor, returning to the specimen vault."
        examine:
          default: "Reinforced industrial steel stairs leading down to Floor 1 specimen vault."
    trailing_description: |
      A reinforced catwalk extends to the east. You can also head DOWN the stairs.
    items: []
    exit_destinations: {}

  - name: upper_catwalk
    exits:
      - west
      - portal
    exit_destinations:
      portal:
        floor: 0
        x: 1
        y: 0
    base_description: |
      The high-altitude upper catwalk above the facility floor.
    fixtures:
      resonance_conduit:
        priority: 10
        state: default
        states:
          default: "A matching dimensional portal hovers at the edge of the platform, linked to the translocation lab."
        examine:
          default: "A vertical spatial displacement field. Entering the PORTAL will transport you back down to the translocation lab."
    trailing_description: |
      The catwalk heads west to the mezzanine gallery, or you can enter the PORTAL.
    items: []

  - name: archive_sanctum
    exits:
      - portal
    exit_destinations:
      portal:
        floor: 0
        x: 0
        y: 0
    base_description: |
      A secret archive sanctum hidden deep in the subterranean facility foundations.
    fixtures:
      ancient_pedestal:
        priority: 10
        state: default
        states:
          default: "An illuminated terminal pedestal sits in the center, surrounded by a swirling return portal."
        examine:
          default: "Subterranean control systems. Entering the PORTAL here will return you to the specimen vault."
    trailing_description: |
      The active return PORTAL hums quietly on the pedestal.
    items: []

# =============================================================================
# EVENTS
# =============================================================================
events:
  # ACTION 1: Pull the power switch
  # Changes fixture state AND opens an event-created portal to archive_sanctum!
  - id: activate_vault_power
    trigger:
      type: solo
      target: power_switch
      action: pull
    conditions:
      - type: in_room
        room: specimen_vault
        fail_hint: "The power switch is inside the specimen vault."
    result:
      set_fixture_state:
        - room: specimen_vault
          fixture: power_switch
          state: energized
      open_exit:
        - room: specimen_vault
          direction: portal
          destination:
            floor: 2
            x: 0
            y: 0
      message: |
        With a heavy mechanical thud, you pull the switch down!
        Auxiliary generators spin up, energizing the blue conduit along the walls.
        A tear in the fabric of space forms in the center of the vault — an active PORTAL has opened!

  # ACTION 2: Use crystal on the pod
  # Changes the 'containment_pod' fixture to 'breached' AND reveals 'wall_crevice'
  - id: breach_specimen_pod
    trigger:
      type: dual
      source: crystal_resonator
      target: containment_pod
      action: use
    conditions:
      - type: in_room
        room: specimen_vault
        fail_hint: "The containment pod is in the center of the specimen vault."
      - type: required_items
        required_items:
          - crystal_resonator
        fail_hint: "You need the crystal resonator to harmonize with the acoustic seal."
    result:
      set_fixture_state:
        - room: specimen_vault
          fixture: containment_pod
          state: breached
        - room: specimen_vault
          fixture: wall_crevice
          state: revealed
      add_item: containment_keycard
      message: |
        You hold the vibrating crystal against the acoustic clamp.
        A harmonic chord rings through the chamber, and the seal unlatches with a hiss of vapor!
        The pod opens, exposing a concealed crevice in the wall and dropping a keycard into your hands.

  # ACTION 3: Use keycard on hatch in security corridor
  # Opens an event-created 'down' exit leading to archive_sanctum!
  - id: unlock_maintenance_hatch
    trigger:
      type: dual
      source: containment_keycard
      target: hatch_mechanism
      action: use
    conditions:
      - type: in_room
        room: security_corridor
        fail_hint: "The maintenance hatch is in the security corridor."
      - type: required_items
        required_items:
          - containment_keycard
        fail_hint: "You need the magnetic keycard to release the hatch latches."
    result:
      set_fixture_state:
        - room: security_corridor
          fixture: hatch_mechanism
          state: unlocked
      open_exit:
        - room: security_corridor
          direction: down
          destination:
            floor: 2
            x: 0
            y: 0
      message: |
        You swipe the magnetic keycard through the hatch console.
        Heavy pneumatic latches release with a loud clatter! The maintenance hatch pops open, revealing an iron ladder leading DOWN into the archive sanctum!

# =============================================================================
# MAP FLOORS GRID
# =============================================================================
floors:
  # Floor 0 (Ground level)
  - - [specimen_vault, translocation_lab]
    - [security_corridor, null]

  # Floor 1 (Upper level)
  - - [mezzanine_observation, upper_catwalk]
    - [null, null]

  # Floor 2 (Subterranean level)
  - - [archive_sanctum, null]
    - [null, null]
